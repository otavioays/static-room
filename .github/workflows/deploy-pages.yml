name: Deploy Static Room to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html decorations.css decorations.js _site/

          assets=(
            "dobra1.png"
            "mola_static_room (1).png"
            "nuvem_static_room (1).png"
            "estrela_static_room (1).png"
            "espiral_static_room (1).png"
            "ChatGPT Image Jul 28, 2026, 12_03_48 AM (5).png"
            "ChatGPT Image Jul 28, 2026, 12_03_48 AM (4).png"
            "ChatGPT Image Jul 28, 2026, 12_03_48 AM (3).png"
            "ChatGPT Image Jul 28, 2026, 12_03_48 AM (2).png"
            "ChatGPT Image Jul 28, 2026, 12_03_47 AM (1).png"
          )

          for asset in "${assets[@]}"; do
            test -s "$asset"
            cp "$asset" _site/
          done

          python - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('</head>', '  <link rel="stylesheet" href="./decorations.css?v=1">\n</head>')
          html = html.replace('</body>', '  <script src="./decorations.js?v=1"></script>\n</body>')
          page.write_text(html, encoding='utf-8')
          PY

          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/decorations.css
          test -s _site/decorations.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
