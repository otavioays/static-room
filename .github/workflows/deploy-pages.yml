name: Deploy Static Room to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html decorations.css decorations.js second-fold.css third-fold.css fourth-fold.css fifth-fold.css reality-loading.css reality-loading.js bag-icon.css _site/

          assets=(
            "dobra1.png"
            "mola_static_room (1).png"
            "nuvem_static_room (1).png"
            "estrela_static_room (1).png"
            "espiral_static_room (1).png"
            "ChatGPT Image Jul 28, 2026, 12_03_48 AM (5).png"
            "ChatGPT Image Jul 28, 2026, 12_03_48 AM (4).png"
            "ChatGPT Image Jul 28, 2026, 12_03_48 AM (3).png"
            "ChatGPT Image Jul 28, 2026, 12_03_48 AM (2).png"
            "ChatGPT Image Jul 28, 2026, 12_03_47 AM (1).png"
            "ChatGPT Image Jul 28, 2026, 12_08_29 AM.png"
            "9c5fd7b0-88cd-4f25-892a-2812f3b00cd8.png"
            "f4244071-4ccf-4e01-9c80-a2f175db0890.png"
            "e424ef6c-e075-4c0a-93d8-23859e3fea39.png"
            "realityloading.png"
            "logostaticroom.png"
            "coisasavenda.png"
            "textoobrigatorio.png"
            "arquivosinuteis.png"
            "darseuemail.png"
            "colecao001.png"
            "ctaatualizado.png"
          )

          for asset in "${assets[@]}"; do
            test -s "$asset"
            cp "$asset" _site/
          done

          test -s "bag.exe"
          cp "bag.exe" "_site/bag.png"

          python - <<'PY'
          from pathlib import Path

          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')

          html = html.replace(
              '<span class="eyebrow">drop 001 / online now</span>',
              '<span class="eyebrow hero-collection-sticker" aria-label="Coleção 001, infelizmente disponível"><img class="hero-collection-image" src="./colecao001.png?v=5" alt="Coleção 001, infelizmente disponível"></span>',
              1
          )

          html = html.replace(
              '<h1>Wear the <span>signal.</span></h1>',
              '<h1 class="hero-cta-title" aria-label="Compre a nossa fase"><img class="hero-cta-image" src="./ctaatualizado.png?v=1" alt="Compre a nossa fase"></h1>',
              1
          )

          html = html.replace(
              '</head>',
              '  <link rel="stylesheet" href="./decorations.css?v=15">\n'
              '  <link rel="stylesheet" href="./second-fold.css?v=6">\n'
              '  <link rel="stylesheet" href="./third-fold.css?v=5">\n'
              '  <link rel="stylesheet" href="./fourth-fold.css?v=4">\n'
              '  <link rel="stylesheet" href="./fifth-fold.css?v=3">\n'
              '  <link rel="stylesheet" href="./reality-loading.css?v=2">\n'
              '  <link rel="stylesheet" href="./bag-icon.css?v=2">\n'
              '  <style>.hero .hero-copy{display:flex;flex-direction:column;align-items:flex-start}.hero .hero-copy>.hero-collection-sticker{display:inline-flex!important;align-self:flex-start!important;position:relative!important;top:34px!important;width:auto!important;max-width:100%!important;padding:0!important;margin:0 0 -28px 2px!important;background:transparent!important;border:0!important;box-shadow:none!important;transform:none!important;line-height:0!important;z-index:4!important}.hero .hero-collection-image{display:block!important;width:clamp(170px,17vw,270px)!important;height:auto!important;max-width:100%!important;object-fit:contain!important}.hero .hero-cta-title{display:block!important;align-self:flex-start!important;width:min(100%,700px)!important;max-width:700px!important;margin:69px 0 14px -90px!important;line-height:0!important;font-size:0!important;letter-spacing:0!important;text-transform:none!important;text-shadow:none!important}.hero .hero-cta-image{display:block!important;width:100%!important;height:auto!important;max-width:none!important;object-fit:contain!important}.hero .hero-collection-sticker+.hero-cta-title{margin-top:69px!important}.hero .hero-cta-title+p{position:relative!important;top:5px!important}@media(max-width:620px){.hero .hero-copy>.hero-collection-sticker{top:22px!important;margin-bottom:-18px!important}.hero .hero-collection-image{width:min(58vw,220px)!important}.hero .hero-cta-title{width:min(94vw,560px)!important;margin:40px 0 10px -22px!important}.hero .hero-collection-sticker+.hero-cta-title{margin-top:40px!important}}</style>\n'
              '</head>'
          )
          html = html.replace(
              '</body>',
              '  <script src="./decorations.js?v=21"></script>\n'
              '  <script src="./reality-loading.js?v=2"></script>\n'
              '</body>'
          )

          if 'colecao001.png?v=5' not in html:
              raise RuntimeError('collection artwork missing from generated HTML')
          if 'ctaatualizado.png?v=1' not in html:
              raise RuntimeError('updated CTA artwork missing from generated HTML')

          page.write_text(html, encoding='utf-8')

          script = Path('_site/decorations.js')
          js = script.read_text(encoding='utf-8')
          old = "  html('.hero h1', 'COMPRE A <span>NOSSA FASE.</span>');"
          new = """  const heroTitle = document.querySelector('.hero h1');
          if (heroTitle) {
            heroTitle.classList.add('hero-cta-title');
            heroTitle.setAttribute('aria-label', 'Compre a nossa fase');
            let ctaImage = heroTitle.querySelector('.hero-cta-image');
            if (!ctaImage) {
              ctaImage = document.createElement('img');
              ctaImage.className = 'hero-cta-image';
              heroTitle.replaceChildren(ctaImage);
            }
            ctaImage.src = file('ctaatualizado.png?v=1');
            ctaImage.alt = 'Compre a nossa fase';
            ctaImage.draggable = false;
            ctaImage.decoding = 'async';
            ctaImage.loading = 'eager';
          }"""
          if old not in js:
              raise RuntimeError('original hero headline replacement was not found')
          script.write_text(js.replace(old, new, 1), encoding='utf-8')
          PY

          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/decorations.css
          test -s _site/decorations.js
          test -s _site/second-fold.css
          test -s _site/third-fold.css
          test -s _site/fourth-fold.css
          test -s _site/fifth-fold.css
          test -s _site/reality-loading.css
          test -s _site/reality-loading.js
          test -s _site/bag-icon.css
          test -s _site/bag.png
          test -s "_site/ChatGPT Image Jul 28, 2026, 12_08_29 AM.png"
          test -s "_site/9c5fd7b0-88cd-4f25-892a-2812f3b00cd8.png"
          test -s "_site/f4244071-4ccf-4e01-9c80-a2f175db0890.png"
          test -s "_site/e424ef6c-e075-4c0a-93d8-23859e3fea39.png"
          test -s "_site/realityloading.png"
          test -s "_site/logostaticroom.png"
          test -s "_site/coisasavenda.png"
          test -s "_site/textoobrigatorio.png"
          test -s "_site/arquivosinuteis.png"
          test -s "_site/darseuemail.png"
          test -s "_site/colecao001.png"
          test -s "_site/ctaatualizado.png"
          grep -q 'colecao001.png?v=5' _site/index.html
          grep -q 'ctaatualizado.png?v=1' _site/index.html
          grep -q 'ctaatualizado.png?v=1' _site/decorations.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
