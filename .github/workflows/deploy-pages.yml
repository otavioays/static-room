name: Deploy Static Room to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html decorations.css decorations.js second-fold.css third-fold.css fourth-fold.css fifth-fold.css reality-loading.css reality-loading.js bag-icon.css _site/

          assets=(
            "dobra1.png"
            "mola_static_room (1).png"
            "nuvem_static_room (1).png"
            "estrela_static_room (1).png"
            "espiral_static_room (1).png"
            "ChatGPT Image Jul 28, 2026, 12_03_48 AM (5).png"
            "ChatGPT Image Jul 28, 2026, 12_03_48 AM (4).png"
            "ChatGPT Image Jul 28, 2026, 12_03_48 AM (3).png"
            "ChatGPT Image Jul 28, 2026, 12_03_48 AM (2).png"
            "ChatGPT Image Jul 28, 2026, 12_03_47 AM (1).png"
            "ChatGPT Image Jul 28, 2026, 12_08_29 AM.png"
            "9c5fd7b0-88cd-4f25-892a-2812f3b00cd8.png"
            "f4244071-4ccf-4e01-9c80-a2f175db0890.png"
            "e424ef6c-e075-4c0a-93d8-23859e3fea39.png"
            "realityloading.png"
            "logostaticroom.png"
            "coisasavenda.png"
            "textoobrigatorio.png"
            "arquivosinuteis.png"
            "darseuemail.png"
            "colecao001.png"
            "adesivocta.png"
          )

          for asset in "${assets[@]}"; do
            test -s "$asset"
            cp "$asset" _site/
          done

          test -s "bag.exe"
          cp "bag.exe" "_site/bag.png"

          python - <<'PY'
          from pathlib import Path

          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')

          old_eyebrow = '<span class="eyebrow">drop 001 / online now</span>'
          old_title = '<h1>Wear the <span>signal.</span></h1>'
          old_description = '<p>Roupas e artefatos para quem cresceu online e nunca voltou completamente.</p>'

          if old_eyebrow not in html or old_title not in html or old_description not in html:
              raise RuntimeError('original hero artwork or description markup was not found')

          html = html.replace(
              old_eyebrow,
              '<span class="eyebrow hero-collection-sticker" aria-label="Coleção 001, infelizmente disponível"><img class="hero-collection-image" src="./colecao001.png?v=6" alt="Coleção 001, infelizmente disponível"></span>',
              1
          )
          html = html.replace(
              old_title,
              '<div class="hero-cta-sticker" aria-label="Compre, estamos implorando"><img class="hero-cta-sticker-image" src="./adesivocta.png?v=1" alt="Compre, estamos implorando"></div>',
              1
          )
          html = html.replace(old_description, '', 1)

          html = html.replace(
              '</head>',
              '  <link rel="stylesheet" href="./decorations.css?v=15">\n'
              '  <link rel="stylesheet" href="./second-fold.css?v=6">\n'
              '  <link rel="stylesheet" href="./third-fold.css?v=5">\n'
              '  <link rel="stylesheet" href="./fourth-fold.css?v=4">\n'
              '  <link rel="stylesheet" href="./fifth-fold.css?v=3">\n'
              '  <link rel="stylesheet" href="./reality-loading.css?v=2">\n'
              '  <link rel="stylesheet" href="./bag-icon.css?v=2">\n'
              '  <style>.hero .hero-copy{display:flex;flex-direction:column;align-items:flex-start;max-width:760px!important}.hero .hero-copy>.hero-collection-sticker{display:inline-flex!important;align-self:flex-start!important;position:relative!important;top:34px!important;z-index:7!important;width:auto!important;max-width:100%!important;padding:0!important;margin:18px 0 -28px 2px!important;background:transparent!important;border:0!important;box-shadow:none!important;transform:none!important;line-height:0!important}.hero .hero-collection-image{display:block!important;width:clamp(170px,17vw,270px)!important;height:auto!important;max-width:100%!important;object-fit:contain!important}.hero .hero-cta-sticker{display:block!important;align-self:flex-start!important;position:relative!important;z-index:5!important;width:min(100%,760px)!important;max-width:760px!important;margin:4px 0 18px -90px!important;padding:0!important;background:transparent!important;border:0!important;box-shadow:none!important;line-height:0!important}.hero .hero-cta-sticker-image{display:block!important;width:100%!important;height:auto!important;max-width:none!important;object-fit:contain!important}.hero .hero-actions{position:relative!important;z-index:6!important;margin-top:0!important}@media(max-width:620px){.hero .hero-copy{max-width:100%!important}.hero .hero-copy>.hero-collection-sticker{top:22px!important;margin:14px 0 -18px 0!important}.hero .hero-collection-image{width:min(58vw,220px)!important}.hero .hero-cta-sticker{width:min(96vw,640px)!important;margin:4px 0 12px -22px!important}}</style>\n'
              '</head>'
          )
          html = html.replace(
              '</body>',
              '  <script src="./decorations.js?v=26"></script>\n'
              '  <script src="./reality-loading.js?v=2"></script>\n'
              '</body>'
          )

          if 'colecao001.png?v=6' not in html:
              raise RuntimeError('collection artwork missing from generated HTML')
          if 'adesivocta.png?v=1' not in html:
              raise RuntimeError('combined CTA sticker missing from generated HTML')
          if old_description in html:
              raise RuntimeError('hero description was not removed')

          page.write_text(html, encoding='utf-8')
          PY

          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/decorations.css
          test -s _site/decorations.js
          test -s _site/second-fold.css
          test -s _site/third-fold.css
          test -s _site/fourth-fold.css
          test -s _site/fifth-fold.css
          test -s _site/reality-loading.css
          test -s _site/reality-loading.js
          test -s _site/bag-icon.css
          test -s _site/bag.png
          test -s "_site/ChatGPT Image Jul 28, 2026, 12_08_29 AM.png"
          test -s "_site/9c5fd7b0-88cd-4f25-892a-2812f3b00cd8.png"
          test -s "_site/f4244071-4ccf-4e01-9c80-a2f175db0890.png"
          test -s "_site/e424ef6c-e075-4c0a-93d8-23859e3fea39.png"
          test -s "_site/realityloading.png"
          test -s "_site/logostaticroom.png"
          test -s "_site/coisasavenda.png"
          test -s "_site/textoobrigatorio.png"
          test -s "_site/arquivosinuteis.png"
          test -s "_site/darseuemail.png"
          test -s "_site/colecao001.png"
          test -s "_site/adesivocta.png"
          grep -q 'colecao001.png?v=6' _site/index.html
          grep -q 'adesivocta.png?v=1' _site/index.html
          ! grep -q 'Roupas e artefatos para quem cresceu online' _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
