name: Add prices popup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add prices image modal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = r'''    /* prices-popup */
              body.prices-open{overflow:hidden}
              .prices-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:clamp(16px,4vw,48px);background:rgba(19,13,22,.84);backdrop-filter:blur(7px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .24s ease,visibility .24s ease}
              .prices-modal.open{opacity:1;visibility:visible;pointer-events:auto}
              .prices-popup{position:relative;width:min(92vw,920px);max-height:90vh;display:grid;place-items:center;transform:scale(.86) rotate(-1deg);transition:transform .3s cubic-bezier(.2,.85,.25,1.15);filter:drop-shadow(12px 14px 0 rgba(19,13,22,.72))}
              .prices-modal.open .prices-popup{transform:scale(1) rotate(-1deg)}
              .prices-popup img{display:block;width:auto;height:auto;max-width:100%;max-height:86vh;object-fit:contain}
              .prices-close{position:absolute;z-index:2;top:-16px;right:-16px;width:48px;height:48px;display:grid;place-items:center;border:3px solid var(--ink);background:var(--acid);box-shadow:5px 5px 0 var(--ink);color:var(--ink);font:900 30px/1 Arial,sans-serif;cursor:pointer;transform:rotate(5deg)}
              .prices-close:hover,.prices-close:focus-visible{transform:translate(3px,3px) rotate(1deg);box-shadow:2px 2px 0 var(--ink);outline:none}
              .product-card{cursor:pointer}
              @media(max-width:620px){.prices-modal{padding:12px}.prices-popup{width:96vw}.prices-close{top:-10px;right:-4px;width:44px;height:44px}}
          '''

          if '/* prices-popup */' not in html:
              marker = '    /* product-card-motion */'
              if marker not in html:
                  raise SystemExit('CSS insertion marker not found')
              html = html.replace(marker, css + marker, 1)

          modal = '''  <div class="prices-modal" id="prices-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Preços das camisetas">
              <div class="prices-popup" role="document">
                <button class="prices-close" type="button" aria-label="Fechar preços">×</button>
                <img src="./pre%C3%A7os.png?v=1" alt="Preços das camisetas Static Room" decoding="async">
              </div>
            </div>
          '''
          if 'id="prices-modal"' not in html:
              marker = '  <footer>'
              if marker not in html:
                  raise SystemExit('Modal insertion marker not found')
              html = html.replace(marker, modal + marker, 1)

          html, count = re.subn(
              r'<a class="product-link" href="#signal" aria-label="Ver imagem da camiseta ([^"]+)"></a>',
              r'<a class="product-link" href="#prices-modal" data-open-prices aria-label="Ver preços da camiseta \1"></a>',
              html,
          )
          if count not in (0, 3):
              raise SystemExit(f'Unexpected number of product links changed: {count}')

          script = r'''    const pricesModal=document.querySelector('#prices-modal'),pricesClose=pricesModal?.querySelector('.prices-close');let lastPricesTrigger=null;
              const openPrices=event=>{event.preventDefault();lastPricesTrigger=event.currentTarget;pricesModal?.classList.add('open');pricesModal?.setAttribute('aria-hidden','false');document.body.classList.add('prices-open');pricesClose?.focus()};
              const closePrices=()=>{pricesModal?.classList.remove('open');pricesModal?.setAttribute('aria-hidden','true');document.body.classList.remove('prices-open');lastPricesTrigger?.focus()};
              document.querySelectorAll('[data-open-prices]').forEach(link=>link.addEventListener('click',openPrices));
              pricesClose?.addEventListener('click',closePrices);pricesModal?.addEventListener('click',event=>{if(event.target===pricesModal)closePrices()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&pricesModal?.classList.contains('open'))closePrices()});
          '''
          if 'const pricesModal=' not in html:
              marker = "    const form=document.querySelector('.signup')"
              if marker not in html:
                  raise SystemExit('JavaScript insertion marker not found')
              html = html.replace(marker, script + marker, 1)

          if 'pre%C3%A7os.png' not in html or html.count('data-open-prices') != 3:
              raise SystemExit('Prices popup validation failed')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/add-prices-popup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-prices-popup.yml
          git commit -m "feat: open prices image when products are clicked"
          git push
