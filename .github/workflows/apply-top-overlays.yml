name: Apply top overlays

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put clean overlays at the top
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_old = '.product-visual img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;object-position:center}.product-visual::before,.product-visual::after{display:none}.product-link{position:absolute;inset:0;z-index:4}'
          css_new = '.shirt-image{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;object-position:center}.product-visual::before,.product-visual::after{display:none}.top-overlay{position:absolute;z-index:3;top:0;left:50%;width:58%;max-width:260px;height:auto;display:block;object-fit:contain;transform:translateX(-50%);pointer-events:none}.product-link{position:absolute;inset:0;z-index:4}'
          if css_old not in text:
              raise SystemExit('CSS dos cards não encontrado')
          text = text.replace(css_old, css_new, 1)

          mobile_old = '.product-visual{min-height:420px;height:auto}.eye-poster'
          mobile_new = '.product-visual{min-height:420px;height:auto}.top-overlay{width:52%;max-width:220px}.eye-poster'
          if mobile_old not in text:
              raise SystemExit('CSS mobile não encontrado')
          text = text.replace(mobile_old, mobile_new, 1)

          cards = {
              '<div class="product-visual visual-one"><img src="./cb008226-a63d-4959-9966-468942347b0a.png?v=2" alt="Camiseta Static Room, modelo 1" loading="lazy" decoding="async"></div>': '<div class="product-visual visual-one"><img class="shirt-image" src="./cb008226-a63d-4959-9966-468942347b0a.png?v=3" alt="Camiseta Static Room, modelo 1" loading="lazy" decoding="async"><img class="top-overlay" src="./ChatGPT%20Image%20Jul%2030,%202026,%2001_18_22%20AM.png?v=2" alt="Detalhe visual sobreposto no topo da primeira camiseta" loading="lazy" decoding="async"></div>',
              '<div class="product-visual visual-two"><img src="./ce773a28-f419-4abf-a555-2d487bce5010.png?v=2" alt="Camiseta Static Room, modelo 2" loading="lazy" decoding="async"></div>': '<div class="product-visual visual-two"><img class="shirt-image" src="./ce773a28-f419-4abf-a555-2d487bce5010.png?v=3" alt="Camiseta Static Room, modelo 2" loading="lazy" decoding="async"><img class="top-overlay" src="./ChatGPT%20Image%20Jul%2030,%202026,%2001_18_26%20AM.png?v=2" alt="Detalhe visual sobreposto no topo da segunda camiseta" loading="lazy" decoding="async"></div>',
              '<div class="product-visual visual-three"><img src="./monark.png?v=2" alt="Camiseta Static Room, modelo Monark" loading="lazy" decoding="async"></div>': '<div class="product-visual visual-three"><img class="shirt-image" src="./monark.png?v=3" alt="Camiseta Static Room, modelo Monark" loading="lazy" decoding="async"><img class="top-overlay" src="./ChatGPT%20Image%20Jul%2030,%202026,%2001_18_28%20AM.png?v=2" alt="Detalhe visual sobreposto no topo da terceira camiseta" loading="lazy" decoding="async"></div>',
          }

          for old, new in cards.items():
              if old not in text:
                  raise SystemExit('Um dos cards não foi encontrado')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-top-overlays.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-top-overlays.yml
          git commit -m "style: place clean images at top of clothing cards"
          git push origin HEAD:main
