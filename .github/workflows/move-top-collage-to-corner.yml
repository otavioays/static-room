name: Move top collage stickers to corners

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  move-stickers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move top collage stickers to upper-left corners
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          replacements = {
              '.top-collage{position:absolute;z-index:3;top:-3px;left:50%;width:48%;max-width:220px;height:72px;overflow:hidden;transform:translateX(-50%) rotate(-4deg);transform-origin:center top;pointer-events:none}':
              '.top-collage{position:absolute;z-index:3;top:-3px;left:-3px;width:48%;max-width:220px;height:72px;overflow:hidden;transform:rotate(-4deg);transform-origin:left top;pointer-events:none}',
              '.product-card:nth-child(2) .top-collage{left:50%;width:45%;max-width:205px;transform:translateX(-50%) rotate(4deg)}':
              '.product-card:nth-child(2) .top-collage{left:-3px;width:45%;max-width:205px;transform:rotate(4deg)}',
              '.product-card:nth-child(3) .top-collage{left:50%;width:46%;max-width:210px;transform:translateX(-50%) rotate(-3deg)}':
              '.product-card:nth-child(3) .top-collage{left:-3px;width:46%;max-width:210px;transform:rotate(-3deg)}',
          }

          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'Expected CSS not found: {old[:80]}')
              html = html.replace(old, new, 1)

          if html.count('class="top-collage"') != 3:
              raise SystemExit('Expected exactly three top-collage stickers')

          path.write_text(html, encoding='utf-8')
          PY

          git rm .github/workflows/move-top-collage-to-corner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "style: move top collage stickers to card corners"
          git push origin HEAD:main
