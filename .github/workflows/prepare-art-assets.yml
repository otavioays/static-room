name: Prepare illustrated art assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-art-assets.yml'
      - 'ChatGPT Image Jul 27, 2026, 08_37_19 AM (1).png'
      - 'ChatGPT Image Jul 27, 2026, 08_37_19 AM (2).png'
      - 'ChatGPT Image Jul 27, 2026, 08_37_20 AM (3).png'
      - 'ChatGPT Image Jul 27, 2026, 08_37_20 AM (4).png'
      - 'ChatGPT Image Jul 27, 2026, 08_37_20 AM (5).png'
      - 'ChatGPT Image Jul 27, 2026, 08_55_*.png'
      - 'ChatGPT Image Jul 27, 2026, 09_03_00 AM.png'
      - 'ChatGPT Image Jul 27, 2026, 09_10_49 AM.png'
      - 'bfcc1a2f-2c88-42a4-a0dc-fe5bb58b9fc4.png'

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Crop and organize literal uploaded PNGs
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import shutil

          output = Path('assets/art')
          output.mkdir(parents=True, exist_ok=True)

          mapping = {
            'ChatGPT Image Jul 27, 2026, 08_37_19 AM (1).png': ('eye.png', 900),
            'ChatGPT Image Jul 27, 2026, 08_37_19 AM (2).png': ('bird.png', 700),
            'ChatGPT Image Jul 27, 2026, 08_37_20 AM (3).png': ('lizard.png', 700),
            'ChatGPT Image Jul 27, 2026, 08_37_20 AM (4).png': ('sr-badge.png', 700),
            'ChatGPT Image Jul 27, 2026, 08_37_20 AM (5).png': ('smiley.png', 700),
            'ChatGPT Image Jul 27, 2026, 08_55_33 AM (1).png': ('letter-s.png', 620),
            'ChatGPT Image Jul 27, 2026, 08_55_34 AM (2).png': ('letter-t.png', 620),
            'ChatGPT Image Jul 27, 2026, 08_55_34 AM (3).png': ('letter-a.png', 620),
            'ChatGPT Image Jul 27, 2026, 08_55_34 AM (4).png': ('letter-i.png', 620),
            'ChatGPT Image Jul 27, 2026, 08_55_34 AM (5).png': ('letter-c.png', 620),
            'ChatGPT Image Jul 27, 2026, 08_55_34 AM (6).png': ('letter-r.png', 620),
            'ChatGPT Image Jul 27, 2026, 08_55_40 AM (1).png': ('letter-o.png', 620),
            'ChatGPT Image Jul 27, 2026, 08_55_41 AM (2).png': ('letter-m.png', 620),
            'ChatGPT Image Jul 27, 2026, 08_55_41 AM (3).png': ('letter-e.png', 620),
            'ChatGPT Image Jul 27, 2026, 08_55_41 AM (4).png': ('letter-u.png', 620),
          }

          def trim_alpha(image, threshold=96, padding=24):
            image = image.convert('RGBA')
            mask = image.getchannel('A').point(lambda alpha: 255 if alpha >= threshold else 0)
            box = mask.getbbox()
            if not box:
              return image
            left, top, right, bottom = box
            return image.crop((
              max(0, left - padding),
              max(0, top - padding),
              min(image.width, right + padding),
              min(image.height, bottom + padding),
            ))

          for source_name, (target_name, max_dimension) in mapping.items():
            image = trim_alpha(Image.open(source_name))
            if max(image.size) > max_dimension:
              ratio = max_dimension / max(image.size)
              image = image.resize(
                (round(image.width * ratio), round(image.height * ratio)),
                Image.Resampling.LANCZOS,
              )
            image.save(output / target_name, optimize=True)

          shutil.copy2('ChatGPT Image Jul 27, 2026, 09_03_00 AM.png', output / 'pastel-background.png')
          shutil.copy2('ChatGPT Image Jul 27, 2026, 09_10_49 AM.png', output / 'page-base.png')
          shutil.copy2('bfcc1a2f-2c88-42a4-a0dc-fe5bb58b9fc4.png', output / 'hero-banner.png')
          PY
      - name: Commit prepared assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/art
          git diff --cached --quiet && exit 0
          git commit -m 'build: prepare literal illustrated assets'
          git push
