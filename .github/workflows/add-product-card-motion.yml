name: Add product card motion

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  animate-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add floating motion to product cards
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          marker = '/* product-card-motion */'

          if marker not in html:
              motion_css = '''
    /* product-card-motion */
    @keyframes sr-card-float-one{0%,100%{translate:0 0}50%{translate:0 -10px}}
    @keyframes sr-card-float-two{0%,100%{translate:0 0}50%{translate:5px -8px}}
    @keyframes sr-card-float-three{0%,100%{translate:0 0}50%{translate:-5px -11px}}
    .product-card.visible{will-change:translate;animation:sr-card-float-one 5.6s ease-in-out infinite}
    .product-card.visible:nth-child(2){animation-name:sr-card-float-two;animation-duration:6.4s;animation-delay:-1.7s}
    .product-card.visible:nth-child(3){animation-name:sr-card-float-three;animation-duration:5.9s;animation-delay:-3.1s}
    .product-card:hover{animation-play-state:paused}
'''
              anchor = '    @media(prefers-reduced-motion:reduce)'
              if anchor not in html:
                  raise RuntimeError('reduced-motion media query anchor not found')
              html = html.replace(anchor, motion_css + anchor, 1)
              page.write_text(html, encoding='utf-8')

          workflow = Path('.github/workflows/add-product-card-motion.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-product-card-motion.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: animate product cards"
          git push
