<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Static Room</title>
  <style>
    *{box-sizing:border-box}

    html,
    body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#eed2ae;
    }

    body{
      overflow-x:hidden;
    }

    .page-canvas{
      position:relative;
      width:100%;
      min-height:100vh;
    }

    .page-background{
      display:block;
      width:100%;
      height:auto;
      max-width:none;
      position:relative;
      z-index:0;
      user-select:none;
      pointer-events:none;
      -webkit-user-drag:none;
    }

    .drawing-panel{
      position:absolute;
      inset:0;
      z-index:1;
    }
  </style>
</head>
<body>
  <div class="page-canvas">
    <img
      class="page-background"
      src="https://raw.githubusercontent.com/otavioays/static-room/40ef4f266bedd1efbdfdfa03774a844a41a9ad52/fundo.png"
      alt=""
      aria-hidden="true"
      draggable="false"
    >
    <main class="drawing-panel" aria-label="Painel Static Room"></main>
  </div>
</body>
</html>
