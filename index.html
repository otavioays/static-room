  <link rel="preload" href="./ChatGPT Image Jul 27, 2026, 01_54_29 PM (2).png?v=1" as="image" />
  <link rel="preload" href="./ChatGPT Image Jul 27, 2026, 01_54_29 PM (3).png?v=1" as="image" />
  <link rel="preload" href="./ChatGPT Image Jul 27, 2026, 01_54_30 PM (4).png?v=1" as="image" />

  <link rel="stylesheet" href="./artboard.css?v=header-art-4" />
  <link rel="stylesheet" href="./header-paper.css?v=1" />
  <link rel="stylesheet" href="./divider-fix.css?v=1" />
  <link rel="stylesheet" href="./wordmark.css?v=7" />
  <link rel="stylesheet" href="./nav-art.css?v=4" />
  <script src="./divider.js?v=1" defer></script>
  <script src="./wordmark-fit.js?v=2" defer></script>
  <script src="./nav-fit.js?v=2" defer></script>
</head>
<body>
  <main class="site-canvas" id="inicio" aria-label="Página ilustrada da Static Room">
    <h1 class="sr-only">Static Room</h1>

    <img
      class="page-background"
      src="./0f787591-64ac-4d80-ad23-1f2675ec2ec3.png"
      alt=""
      aria-hidden="true"
      draggable="false"
    />

    <div class="interactive-layer">
      <div class="header-pastel" aria-hidden="true"></div>

      <div class="header-ui">
        <a class="brand-lockup" href="#inicio" aria-label="Static Room, início">
          <span class="brand-wordmark-frame" aria-hidden="true">
            <img
              class="brand-wordmark"
              src="./ChatGPT Image Jul 27, 2026, 01_40_01 PM.png?v=4"
              alt=""
              draggable="false"
              loading="eager"
              decoding="sync"
            />
          </span>
        </a>

        <nav class="header-nav" aria-label="Navegação principal">
          <a class="nav-link" href="#inicio" aria-label="Início">
            <span class="nav-label-frame nav-label-frame--inicio" aria-hidden="true">
              <img class="nav-label-art" src="./ChatGPT Image Jul 27, 2026, 01_54_28 PM (1).png?v=1" alt="" draggable="false" loading="eager" decoding="sync" />
            </span>
          </a>
          <a class="nav-link" href="#objetos" aria-label="Objetos">
            <span class="nav-label-frame nav-label-frame--objetos" aria-hidden="true">
              <img class="nav-label-art" src="./ChatGPT Image Jul 27, 2026, 01_54_29 PM (2).png?v=1" alt="" draggable="false" loading="eager" decoding="sync" />
            </span>
          </a>
          <a class="nav-link" href="#manifesto" aria-label="Manifesto">
            <span class="nav-label-frame nav-label-frame--manifesto" aria-hidden="true">
              <img class="nav-label-art" src="./ChatGPT Image Jul 27, 2026, 01_54_29 PM (3).png?v=1" alt="" draggable="false" loading="eager" decoding="sync" />
            </span>
          </a>
          <a class="nav-link" href="#arquivo" aria-label="Arquivo">
            <span class="nav-label-frame nav-label-frame--arquivo" aria-hidden="true">
              <img class="nav-label-art" src="./ChatGPT Image Jul 27, 2026, 01_54_30 PM (4).png?v=1" alt="" draggable="false" loading="eager" decoding="sync" />
            </span>
          </a>
          <a class="nav-link" href="#contato" aria-label="Contato">
            <span class="nav-label-frame nav-label-frame--contato" aria-hidden="true">
              <img class="nav-label-art" src="./ChatGPT Image Jul 27, 2026, 04_22_49 PM.png?v=1" alt="" draggable="false" loading="eager" decoding="sync" />
            </span>
          </a>
        </nav>

        <div class="header-actions" aria-label="Ações do cabeçalho">
          <img
            class="header-icon header-icon--spiral"
            src="./espiral_static_room.png"
            alt=""
            aria-hidden="true"
            draggable="false"
            loading="eager"
          />
          <img
            class="header-icon header-icon--smile"
            src="./ChatGPT Image Jul 27, 2026, 08_37_20 AM (5).png"
            alt=""
            aria-hidden="true"
            draggable="false"
            loading="eager"
          />
          <a class="chaos-button" href="#objetos">
            <span>ENTRE NO CAOS</span>
            <img
              class="chaos-star"
              src="./estrela_static_room.png"
              alt=""
              aria-hidden="true"
              draggable="false"
            />
          </a>
        </div>
      </div>

      <header class="art-header" aria-label="Divisória ilustrada do cabeçalho">
        <img
          class="art-header__line-image"
          src="./divider.png?v=1"
          alt=""
          aria-hidden="true"
          draggable="false"
          loading="eager"
          decoding="sync"
        />
      </header>

      <span class="section-anchor" id="objetos" style="top:18%" aria-hidden="true"></span>
      <span class="section-anchor" id="manifesto" style="top:42%" aria-hidden="true"></span>
      <span class="section-anchor" id="arquivo" style="top:67%" aria-hidden="true"></span>
      <span class="section-anchor" id="contato" style="top:92%" aria-hidden="true"></span>

</html>
